name: publish Flutter package

on:
  push:
    tags:
      - 'usenavii-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flutter-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/flutter

jobs:
  verify:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: verify tag matches pubspec version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          expected_tag="usenavii-v${package_version}"

          if [ "$TAG" != "$expected_tag" ]; then
            echo "::error::Tag $TAG does not match pubspec version $package_version (expected $expected_tag)"
            exit 1
          fi

      - name: resolve dependencies
        run: flutter pub get

      - name: analyze
        run: flutter analyze --no-fatal-infos

      - name: test
        run: flutter test

  publish:
    name: publish to pub.dev
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
