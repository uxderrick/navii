name: flutter

on:
  push:
    paths:
      - 'packages/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'packages/flutter/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/flutter

jobs:
  verify:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: diagnose workspace after pub get
        run: |
          git status --short
          git diff -- analysis_options.yaml example/analysis_options.yaml

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: diagnose workspace after analyze
        run: |
          git status --short
          git diff -- analysis_options.yaml example/analysis_options.yaml

      - name: flutter test
        run: flutter test

      - name: diagnose workspace after test
        run: |
          git status --short
          git diff -- analysis_options.yaml example/analysis_options.yaml

      - name: pub publish dry-run
        run: dart pub publish --dry-run
