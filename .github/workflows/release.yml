name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/navii-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter '@usenavii/core' run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test

  publish-image:
    name: publish docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: publish npm packages
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile=false

      - name: build npm packages
        run: |
          set -euo pipefail
          for package_name in \
            @usenavii/core \
            @usenavii/react \
            @usenavii/react-native \
            @usenavii/vue \
            @usenavii/svelte
          do
            pnpm --filter "$package_name" run build
          done

      - name: stage CHANGELOG into each package
        run: |
          set -euo pipefail
          for package_dir in core react react-native vue svelte; do
            cp CHANGELOG.md "packages/$package_dir/CHANGELOG.md"
          done

      - name: validate npm packages
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const packageDirs = ['core', 'react', 'react-native', 'vue', 'svelte'];
          const manifests = packageDirs.map((packageDir) => {
            const path = `packages/${packageDir}/package.json`;
            return {
              packageDir,
              manifest: JSON.parse(fs.readFileSync(path, 'utf8')),
            };
          });

          const expectedVersion = manifests[0].manifest.version;
          for (const { packageDir, manifest } of manifests) {
            if (manifest.version !== expectedVersion) {
              throw new Error(
                `${manifest.name} is ${manifest.version}; expected ${expectedVersion}`,
              );
            }

            if (packageDir === 'core') continue;

            const expectedCoreRange = `workspace:^${expectedVersion}`;
            const actualCoreRange = manifest.dependencies?.['@usenavii/core'];
            if (actualCoreRange !== expectedCoreRange) {
              throw new Error(
                `${manifest.name} depends on @usenavii/core ${actualCoreRange}; expected ${expectedCoreRange}`,
              );
            }
          }

          console.log(`Validated five npm packages at version ${expectedVersion}`);
          NODE

          package_tarballs="$RUNNER_TEMP/navii-package-tarballs"
          mkdir -p "$package_tarballs"
          for package_dir in core react react-native vue svelte; do
            (
              cd "packages/$package_dir"
              pnpm pack --pack-destination "$package_tarballs"
            )
          done

      - name: publish npm packages
        run: |
          set -euo pipefail
          for package_dir in core react react-native vue svelte; do
            package_name=$(node -p "require('./packages/$package_dir/package.json').name")
            package_version=$(node -p "require('./packages/$package_dir/package.json').version")

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version already on registry — skipping"
              continue
            fi

            echo "Publishing $package_name@$package_version"
            (
              cd "packages/$package_dir"
              pnpm publish --access public --no-git-checks
            )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-notes:
    name: github release notes
    needs: publish-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: extract CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:[[:space:]]/ { exit }
            capture { print }
          ' CHANGELOG.md > notes.md

          # awk preserves trailing blank lines from the capture; trim them.
          sed -i -e :a -e '/^$/{$d;N;ba' -e '}' notes.md || true

          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

          echo "--- notes.md ---"
          cat notes.md

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — updating notes"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md
          fi
