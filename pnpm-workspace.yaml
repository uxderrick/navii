packages:
  - 'packages/*'

strictPeerDependencies: true
autoInstallPeers: true

allowBuilds:
  esbuild: true
  '@resvg/resvg-js': true
minimumReleaseAgeExclude:
  - '@shikijs/core@4.5.0'
  - '@shikijs/engine-javascript@4.5.0'
  - '@shikijs/engine-oniguruma@4.5.0'
  - '@shikijs/langs@4.5.0'
  - '@shikijs/primitive@4.5.0'
  - '@shikijs/themes@4.5.0'
  - '@shikijs/types@4.5.0'
  - '@sveltejs/package@3.0.0'
  - '@types/node@26.6.4'
  - shiki@4.5.0
  - '@mhaadi/svg@0.4.0'
  # Security fix for GHSA-qhm2-7mpr-ghjp, published November 20.
  - '@hono/node-server@2.1.11'

overrides:
  # tsup still pins esbuild 0.27, which has a Windows dev-server file-read advisory.
  esbuild: ^0.28.2
  # Auto-installed Better SVG peers can resolve separately from workspace dev dependencies.
  'astro@7': ^7.4.13
  'solid-js@1': ^1.9.19
  'vite@8': ^8.3.8
  '@polar-sh/sdk>zod': ^4.6.7
  ajv>fast-uri: ^3.1.9
  'undici@8': ^8.12.4
  # The Vitest suites use Node or jsdom. Skip the unused optional DOM implementation.
  'vitest>happy-dom': '-'
  # js-beautify's current ranges predate the fixed glob and minimatch releases.
  'js-beautify>glob': ^14.0.6
  'js-beautify>editorconfig': ^4.0.1
