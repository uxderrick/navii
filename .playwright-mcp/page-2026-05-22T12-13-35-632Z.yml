        - list [ref=e115]:
          - listitem [ref=e116]: SVG generation is essentially free (~microseconds per avatar).
          - listitem [ref=e117]: PNG raster is the expensive op — depends on size. ~10–40 ms for 256 px on a small VPS, dominated by resvg's text + filter pipeline.
          - listitem [ref=e118]:
            - text: In-process PNG cache (LRU) absorbs repeated hits. Default 500 entries; tune via
            - code [ref=e119]: PNG_CACHE_SIZE
            - text: .
          - listitem [ref=e120]: For multi-replica horizontal scale, swap the rate-limit Map for Redis (current implementation is single-process).
