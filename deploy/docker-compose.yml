# Production compose for Hetzner.
#
# Assumes host already runs a reverse proxy (Caddy/Nginx). API binds to
# 127.0.0.1:8787 only — not exposed publicly. The host proxy forwards
# https://api.navii.dev → 127.0.0.1:8787.
#
# Usage on the box:
#   cd /opt/navii && docker compose pull && docker compose up -d

services:
  api:
    image: ${IMAGE:-ghcr.io/uxderrick/navii-api:latest}
    container_name: navii-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: "0.0.0.0"
      TRUST_PROXY: "1"
      RATE_LIMIT_PER_MIN: "600"
      PNG_CACHE_SIZE: "1000"
      LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:8787:8787"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    ports:
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "768M"

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
      POSTGRES_DB: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  log-shipper:
    image: node:22-alpine
    container_name: log-shipper
    restart: unless-stopped
    volumes:
      - /var/log/caddy:/logs:ro
      - ./shipper.mjs:/app/shipper.mjs:ro
    environment:
      UMAMI_URL: https://analytics.uxderrick.com/api/send
      UMAMI_WEBSITE_ID: 9976751b-f339-414d-ab83-5cff4c953b8c
      LOG_FILE: /logs/navii-api.log
      HOSTNAME_OVERRIDE: api.navii.dev
      POLL_MS: "2000"
    command: ["node", "/app/shipper.mjs"]
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "128M"

volumes:
  umami-db-data:
